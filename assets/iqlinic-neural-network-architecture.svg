<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title>iQlinic Backend Architecture &amp; Multi-Task Neural Network</title>
<desc>System architecture diagram showing patient, clinical, temporal, provider and schedule features entering a shared deep representation, branching into treatment, continuity, timing, doctor-ranking and time-slot heads, followed by rules, constraints, explanations and human-reviewed outputs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050912"/><stop offset="1" stop-color="#071426"/></linearGradient>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1930"/><stop offset="1" stop-color="#08111e"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#201747"/><stop offset="1" stop-color="#101630"/></linearGradient>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#72d9ff"/></marker>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#eaf5ff}.muted{fill:#8da2b8}.tiny{font-size:12px}.small{font-size:14px}.lab{font-size:12px;font-weight:700;letter-spacing:1.2px}.h{font-size:19px;font-weight:700}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#a9b9cb}.panel{fill:url(#p);stroke:#2f6692;stroke-width:1.2}.card{fill:#0b1628;stroke:#244d70;stroke-width:1}.line{stroke:#72d9ff;stroke-width:1.8;fill:none;marker-end:url(#a)}.thin{stroke:#63708f;stroke-width:1;opacity:.6}.cyan{fill:#58d2ff}.violet{fill:#8c7cff}.green{fill:#68e2b6}.yellow{fill:#f2c84b}.pink{fill:#ff7d98}.orange{fill:#ffa74f}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1190" cy="120" r="320" fill="#452b95" opacity=".07"/>
<text x="800" y="50" text-anchor="middle" class="title">iQlinic Backend Architecture &amp; Data Flow</text>
<text x="800" y="79" text-anchor="middle" class="sub">Multi-Task Neural Architecture for Treatment Continuity, Timing, Provider &amp; Scheduling Decision Support</text>

<!-- Top pipeline -->
<rect x="28" y="110" width="300" height="400" rx="22" class="panel"/><text x="50" y="142" class="lab" fill="#72d9ff">1 / MULTIMODAL INPUT LAYER</text>
<g class="small"><rect x="50" y="163" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="186" r="6" class="green"/><text x="86" y="191">Demographic &amp; patient profile</text><rect x="50" y="217" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="240" r="6" class="yellow"/><text x="86" y="245">Clinical diagnoses &amp; treatments</text><rect x="50" y="271" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="294" r="6" class="violet"/><text x="86" y="299">Clinical notes / text embeddings</text><rect x="50" y="325" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="348" r="6" class="cyan"/><text x="86" y="353">Imaging &amp; document features</text><rect x="50" y="379" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="402" r="6" fill="#86c8ff"/><text x="86" y="407">Temporal / visit-history features</text><rect x="50" y="433" width="256" height="46" rx="10" class="card"/><circle cx="70" cy="456" r="6" class="orange"/><text x="86" y="461">Doctor, schedule &amp; capacity</text></g>
<path d="M328 310H365" class="line"/>
<rect x="365" y="110" width="300" height="400" rx="22" class="panel" stroke="#3e8a71"/><text x="388" y="142" class="lab" fill="#68e2b6">2 / PREPROCESSING &amp; ENCODING</text>
<g><rect x="390" y="165" width="250" height="52" rx="11" class="card"/><text x="410" y="188" class="h">Validation</text><text x="410" y="205" class="tiny muted">Completeness · consistency · safety</text><path d="M515 217V235" class="line"/><rect x="390" y="237" width="250" height="52" rx="11" class="card"/><text x="410" y="260" class="h">Standardization</text><text x="410" y="277" class="tiny muted">Codes · units · categorical values</text><path d="M515 289V307" class="line"/><rect x="390" y="309" width="250" height="52" rx="11" class="card"/><text x="410" y="332" class="h">Feature Encoders</text><text x="410" y="349" class="tiny muted">Tabular · text · image · temporal</text><path d="M515 361V379" class="line"/><rect x="390" y="381" width="250" height="88" rx="11" fill="#0b2422" stroke="#4da783"/><text x="410" y="408" class="h">Unified Feature Vector</text><text x="410" y="430" class="tiny muted">Concatenated patient representation</text><g transform="translate(412 449)"><circle cx="0" cy="0" r="7" class="green"/><circle cx="24" cy="0" r="7" class="green"/><circle cx="48" cy="0" r="7" class="green"/><circle cx="72" cy="0" r="7" class="green"/><circle cx="96" cy="0" r="7" class="green"/><circle cx="120" cy="0" r="7" class="green"/><circle cx="144" cy="0" r="7" class="green"/><circle cx="168" cy="0" r="7" class="green"/></g></g>
<path d="M665 310H700" class="line"/>
<rect x="700" y="110" width="525" height="400" rx="22" fill="url(#core)" stroke="#7764c5"/><text x="725" y="142" class="lab" fill="#a894ff">3 / SHARED ENCODER + TASK-SPECIFIC HEADS</text>
<rect x="725" y="168" width="215" height="308" rx="17" fill="#111630" stroke="#6b5aa3"/><text x="832" y="194" text-anchor="middle" class="tiny muted">SHARED REPRESENTATION</text>
<g class="violet"><circle cx="765" cy="238" r="10"/><circle cx="765" cy="300" r="10"/><circle cx="765" cy="362" r="10"/><circle cx="765" cy="424" r="10"/><circle cx="832" cy="220" r="10"/><circle cx="832" cy="280" r="10"/><circle cx="832" cy="340" r="10"/><circle cx="832" cy="400" r="10"/><circle cx="900" cy="250" r="10"/><circle cx="900" cy="330" r="10"/><circle cx="900" cy="410" r="10"/></g>
<g class="thin"><path d="M775 238L822 220M775 238L822 280M775 300L822 280M775 300L822 340M775 362L822 340M775 362L822 400M775 424L822 400M842 220L890 250M842 280L890 250M842 280L890 330M842 340L890 330M842 340L890 410M842 400L890 410"/></g>
<text x="966" y="190" class="tiny muted">MULTI-TASK OUTPUT HEADS</text>
<g><rect x="962" y="206" width="235" height="47" rx="10" fill="#201d0a" stroke="#c99e25"/><circle cx="980" cy="229" r="6" class="yellow"/><text x="995" y="234" class="small">Treatment Type Prediction</text><rect x="962" y="262" width="235" height="47" rx="10" fill="#0b241d" stroke="#50a987"/><circle cx="980" cy="285" r="6" class="green"/><text x="995" y="290" class="small">Treatment Continuity</text><rect x="962" y="318" width="235" height="47" rx="10" fill="#0b2030" stroke="#3f91bb"/><circle cx="980" cy="341" r="6" class="cyan"/><text x="995" y="346" class="small">Time-to-Next-Visit</text><rect x="962" y="374" width="235" height="47" rx="10" fill="#28131c" stroke="#bd5670"/><circle cx="980" cy="397" r="6" class="pink"/><text x="995" y="402" class="small">Best Doctor Ranking</text><rect x="962" y="430" width="235" height="47" rx="10" fill="#2a1d0c" stroke="#bd8032"/><circle cx="980" cy="453" r="6" class="orange"/><text x="995" y="458" class="small">Best Time-Slot Ranking</text></g>
<path d="M1225 310H1260" class="line"/>
<rect x="1260" y="110" width="312" height="400" rx="22" class="panel" stroke="#4290a9"/><text x="1284" y="142" class="lab" fill="#72d9ff">4 / DECISION &amp; OPTIMIZATION</text>
<g><rect x="1284" y="166" width="264" height="65" rx="11" class="card"/><text x="1304" y="192" class="h">Rule-Based Filters</text><text x="1304" y="213" class="tiny muted">Clinical and business constraints</text><path d="M1416 231V247" class="line"/><rect x="1284" y="249" width="264" height="65" rx="11" class="card"/><text x="1304" y="275" class="h">Constraint Checking</text><text x="1304" y="296" class="tiny muted">Availability · specialty · capacity</text><path d="M1416 314V330" class="line"/><rect x="1284" y="332" width="264" height="65" rx="11" fill="#0b2028" stroke="#3b95ab"/><text x="1304" y="358" class="h">Scoring &amp; Ranking</text><text x="1304" y="379" class="tiny muted">Feasible options + confidence</text><path d="M1416 397V413" class="line"/><rect x="1284" y="415" width="264" height="65" rx="11" fill="#0b2028" stroke="#3b95ab"/><text x="1304" y="441" class="h">Explanation Layer</text><text x="1304" y="462" class="tiny muted">Key factors · evidence · alternatives</text></g>

<!-- Detailed network -->
<rect x="28" y="545" width="1544" height="290" rx="24" fill="#07111f" stroke="#294b68"/>
<text x="54" y="577" class="lab" fill="#72d9ff">MODEL DETAIL / MULTI-TASK LEARNING</text>
<text x="56" y="612" class="tiny muted">INPUT FEATURE DIMENSIONS</text>
<g class="tiny"><text x="56" y="638">Demographic</text><text x="180" y="638" fill="#68e2b6">[32]</text><text x="56" y="663">Clinical</text><text x="180" y="663" fill="#f2c84b">[64]</text><text x="56" y="688">Treatment history</text><text x="180" y="688" fill="#8c7cff">[128]</text><text x="56" y="713">Text / BERT</text><text x="180" y="713" fill="#8c7cff">[768]</text><text x="56" y="738">Imaging / CNN</text><text x="180" y="738" fill="#58d2ff">[512]</text><text x="56" y="763">Temporal / LSTM</text><text x="180" y="763" fill="#86c8ff">[128]</text><text x="56" y="788">Doctor + schedule</text><text x="180" y="788" fill="#ffa74f">[64]</text></g>
<path d="M228 690H275" class="line"/><rect x="275" y="613" width="128" height="156" rx="15" class="card"/><text x="339" y="642" text-anchor="middle" class="small">Concatenate</text><text x="339" y="666" text-anchor="middle" class="tiny muted">1696 features</text><g transform="translate(300 701)"><circle cx="0" cy="0" r="7" class="green"/><circle cx="26" cy="0" r="7" class="yellow"/><circle cx="52" cy="0" r="7" class="violet"/><circle cx="78" cy="0" r="7" class="cyan"/></g>
<path d="M403 690H437" class="line"/><g><rect x="437" y="626" width="120" height="128" rx="13" fill="#10223a" stroke="#315d84"/><text x="497" y="655" text-anchor="middle" class="small">Dense 1024</text><text x="497" y="680" text-anchor="middle" class="tiny muted">ReLU + BN</text><text x="497" y="704" text-anchor="middle" class="tiny muted">Dropout .30</text><path d="M557 690H582" class="line"/><rect x="582" y="626" width="120" height="128" rx="13" fill="#152244" stroke="#4c588b"/><text x="642" y="655" text-anchor="middle" class="small">Dense 512</text><text x="642" y="680" text-anchor="middle" class="tiny muted">ReLU + BN</text><text x="642" y="704" text-anchor="middle" class="tiny muted">Dropout .30</text><path d="M702 690H727" class="line"/><rect x="727" y="626" width="120" height="128" rx="13" fill="#1b1d4b" stroke="#6257a0"/><text x="787" y="655" text-anchor="middle" class="small">Dense 256</text><text x="787" y="680" text-anchor="middle" class="tiny muted">ReLU</text><text x="787" y="704" text-anchor="middle" class="tiny muted">Dropout .30</text><path d="M847 690H872" class="line"/><rect x="872" y="626" width="120" height="128" rx="13" fill="#25194d" stroke="#7660b1"/><text x="932" y="655" text-anchor="middle" class="small">Dense 128</text><text x="932" y="680" text-anchor="middle" class="tiny muted">Shared</text><text x="932" y="704" text-anchor="middle" class="tiny muted">Embedding</text></g>
<path d="M992 690H1024" class="line"/>
<rect x="1024" y="600" width="260" height="203" rx="16" fill="#0b1526" stroke="#3a5573"/><text x="1044" y="628" class="lab" fill="#a9b9cb">TASK LOSSES</text><g class="tiny"><circle cx="1048" cy="654" r="5" class="yellow"/><text x="1062" y="659">Treatment Type — Cross Entropy</text><circle cx="1048" cy="682" r="5" class="green"/><text x="1062" y="687">Continuity — Binary CE</text><circle cx="1048" cy="710" r="5" class="cyan"/><text x="1062" y="715">Timing — MAE / MSE</text><circle cx="1048" cy="738" r="5" class="pink"/><text x="1062" y="743">Doctor — Ranking Loss</text><circle cx="1048" cy="766" r="5" class="orange"/><text x="1062" y="771">Time Slot — Cross Entropy</text></g>
<rect x="1304" y="600" width="244" height="203" rx="16" fill="#0b1526" stroke="#3a5573"/><text x="1324" y="628" class="lab" fill="#a9b9cb">TRAINING &amp; EVALUATION</text><g class="tiny muted"><text x="1324" y="656">• Weighted multi-task loss</text><text x="1324" y="681">• AdamW + LR scheduler</text><text x="1324" y="706">• Early stopping + K-fold</text><text x="1324" y="731">• Class-imbalance handling</text><text x="1324" y="756">• F1 / NDCG / MAE / Precision@K</text><text x="1324" y="781">• Outcome feedback &amp; calibration</text></g>
<text x="800" y="875" text-anchor="middle" class="tiny muted">Conceptual technical architecture. AI outputs are decision-support signals; clinical diagnosis and final treatment decisions remain human-led.</text>
</svg>