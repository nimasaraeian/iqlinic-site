<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dental clinic AI automation hero</title>
<desc id="desc">A premium modern dental clinic reception with staff reviewing an AI-assisted operational dashboard.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8fb"/><stop offset=".52" stop-color="#d9eef3"/><stop offset="1" stop-color="#b8dce6"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f9fcfd"/><stop offset="1" stop-color="#e6f3f6"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d9e9ed"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1b28"/><stop offset="1" stop-color="#123849"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ed1df"/><stop offset="1" stop-color="#117d9a"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2c6a5"/><stop offset="1" stop-color="#d99570"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8be8f1" stop-opacity=".62"/><stop offset="1" stop-color="#8be8f1" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#183a48" flood-opacity=".18"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>

